  - id: flipkart
    name: Flipkart
    kind: ecommerce
    keywords: ["flipkart"]
    official_domains: [flipkart.com]
    affiliate_domains: []
    lookalike_labels: [flipkart]
# Platform domains where anyone can publish (website builders, hosting, link shorteners).
# A brand claim on these is not evidence of the brand, and they are never "official".
user_content_platforms: [blogspot.com, wordpress.com, wixsite.com, weebly.com, github.io, netlify.app, vercel.app, pages.dev, web.app, firebaseapp.com, sites.google.com, glitch.me, herokuapp.com, onrender.com, bit.ly, tinyurl.com]
