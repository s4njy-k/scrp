# Collector application policy (blueprint §14).
#
# This file is validated by src/config/policy.ts (JSON Schema: config/policy.schema.json).
# It is the collector's own policy, NOT upstream Crawlee/Playwright/Scrapling options;
# each value is mapped explicitly by the code that consumes it.
#
# The first five sections are the blueprint's values unchanged. The sections after
# `queue` derive the request/resource/redirect/event-count bounds and engine settings
# the blueprint requires to be validated before deployment. All values are proposed
# starting points for evaluation on the real VM, not measured requirements.
schema_version: 1
project: cyber-web-collector
profile: browser_evidence
external_providers_enabled: false
ai_required_for_collection: false
limits:
  browser_slots_global: 2
  alternate_browser_slots_max: 1
  http_concurrency_global: 8
  top_level_concurrency_per_domain: 1
  per_domain_delay_seconds: 3
  http_attempts_max: 2
  browser_attempts_max: 2
  acquisition_attempts_max: 4
  active_acquisition_seconds_max: 180
  http_attempt_seconds: 15
  primary_browser_seconds: 60
  alternate_browser_seconds: 90
  finalisation_reserve_seconds: 15
  child_pages_per_target_max: 2
capture:
  viewport: {width: 1440, height: 1000}
  device_scale_factor: 1
  original_format: png
  original_service_workers: allow
  block_ads: false
  suppress_render_resources: false
  full_image_megapixels_max: 20
  scroll_tiles_max: 6
  individual_text_body_mib_max: 5
  attempt_artifacts_mib_max: 50
storage:
  captures_gb_soft_limit: 80
  host_free_gb_pause_below: 30
  host_free_gb_resume_above: 40
  delete_case_hold_artifacts: false
queue:
  heartbeat_seconds: 10
  lease_seconds: 120
  reclaim_expired_leases: true

# ---- Extensions (derived bounds and explicit library mappings) ----
scope:
  allowed_schemes: [https, http]
  # Nonstandard public ports are an explicit policy case: add them here AND to
  # GATEWAY_ALLOWED_PORTS, otherwise the importer rejects the URL with a recorded reason.
  allowed_ports: [80, 443]
  # Domain-only seeds generate one tracked candidate per scheme, tried in this order.
  domain_seed_schemes: [https, http]
  allow_ip_literals: true
  reject_userinfo_urls: true
  follow_external_redirects: true
  max_redirects: 10
bounds:
  max_network_events_per_attempt: 20000
  max_requests_per_attempt: 5000
  max_websocket_frames_per_attempt: 2000
  max_websocket_frame_bytes_retained: 65536
  max_frames_per_page: 50
  max_popups_per_attempt: 5
  max_page_steps: 5
  max_dom_snapshot_mib: 10
  max_image_decode_megapixels: 40
  max_element_captures: 20
  max_scroll_steps: 20
  max_console_messages: 500
http:
  # Fixed per deployment and recorded with every attempt. Not rotated per request.
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
  accept_language: "en-IN,en;q=0.9"
browser:
  primary_engine: chromium
  # Chromium rendering incompatibility gets ONE alternate attempt with this engine.
  alternate_engine: firefox
  chromium_channel: chromium
  # null = use the engine's own user agent (recorded per attempt).
  user_agent: null
  locale: en-IN
  timezone: Asia/Kolkata
  navigation_timeout_seconds: 30
  readiness_max_seconds: 12
  readiness_quiet_ms: 1000
  challenge_wait_seconds: 15
  scroll_step_wait_ms: 350
  body_resource_types: [document, xhr, fetch, eventsource, script]
  recycle_after_jobs: 50
  recycle_after_minutes: 60
  recycle_above_rss_mib: 3500
extraction:
  qr_enabled: true
  ocr_enabled: true
  ocr_concurrency: 1
  ocr_timeout_seconds: 60
  ocr_max_crops_per_attempt: 8
  ai_enabled: false
retention:
  # Days before routine expiry; null = never expires automatically. Case holds always win,
  # and attempts cited by an issued notice, a certificate or an open case are never disposed
  # of by the routine job. Values other than transient triage must come from the approved
  # records-retention schedule (blueprint v4 §27.2): do not invent a blanket period.
  classes:
    transient_triage: 30
    case_evidence: null
    notice_issued: null
    litigation_hold: null
    # Pre-v4 class names, kept so existing jobs and imports stay valid.
    standard: 30
    extended: 180
    permanent: null
  default_class: transient_triage

# ---- v4 extensions (blueprint v4 §29). All have defaults; listed here for review. ----
web:
  session_idle_minutes: 30
  session_absolute_hours: 12
  mfa_required: true
  # Secure cookies work over https and over http://localhost (SSH tunnel). Never disable on a network listener.
  cookie_secure: true
  hsts: false
  login_attempts_per_minute: 5
  lockout_after_failed_logins: 10
  lockout_minutes: 15
  api_requests_per_second: 20
  paginated_list_limit_default: 50
  paginated_list_limit_max: 200
  sse_max_connections: 50
  sse_poll_ms: 2000
  require_case_scope_for_sensitive_search: true
  require_purpose_for_global_search: true
  intake_max_rows: 5000
  intake_max_mib: 10
  upload_max_mib: 25
  dashboard_aggregation_cache_seconds: 30
  show_utc_and_ist: true
governance:
  # These safeguards are fixed by the schema; they cannot be switched off.
  maker_checker_for_external_actions: true
  external_notice_autosend_enabled: false
  auto_takedown_enabled: false
  certificate_autosign: false
  analyst_review_required: true
  false_positive_override_requires_new_evidence: true
  section63_template_source_version: BSA-2023-Schedule-official
  risk_policy_version: risk-rules-1
monitoring:
  actioned_target_revisit_enabled: true
  max_auto_revisits_per_target_per_day: 2
  default_interval_hours: 24
  min_interval_hours: 6
  max_rule_duration_days: 90
  # Revisits run below first captures and pause under disk pressure.
  revisit_priority: -10
  notify_on_resurrection: true
enrichment:
  enabled: true
  dns: true
  tls: true
  rdap: true
  # crt.sh is a third-party service; enable only if approved.
  certificate_transparency: false
  cache_hours: 24
  timeout_seconds: 10
  max_response_kib: 512
